version: '3.8'

services:
  lavalink-config:
    image: python:3.12-alpine
    container_name: klopfer-lavalink-config
    restart: "no"
    working_dir: /config
    command: ["python", "/generate_lavalink_config.py"]
    volumes:
      - ./lavalink:/config
      - ./lavalink/generate_lavalink_config.py:/generate_lavalink_config.py:ro

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: klopfer-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-config:
        condition: service_completed_successfully
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - SERVER_PORT=2333
      - SERVER_ADDRESS=0.0.0.0
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.generated.yml:/opt/Lavalink/application.yml:ro
      - ./lavalink/plugins:/opt/Lavalink/plugins
    networks:
      - klopfer-network

  bot:
    build:
      context: .
      no_cache: true
    container_name: klopfer-bot
    restart: unless-stopped
    depends_on:
      - lavalink
    environment:
      - TOKEN=${TOKEN}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
    volumes:
      - bot-database:/app/database
      - bot-leaderboard:/app/leaderboard
    networks:
      - klopfer-network

volumes:
  bot-database:
    driver: local
  bot-leaderboard:
    driver: local

networks:
  klopfer-network:
    driver: bridge