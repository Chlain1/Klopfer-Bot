services:
  lavalink-config:
    image: python:3.12-alpine
    restart: "no"
    working_dir: /config
    command:
      - python
      - -c
      - |
        import json
        from urllib.request import Request, urlopen

        version = "1.17.0"
        try:
            github_url = "https://api.github.com/repos/lavalink-devs/youtube-source/releases/latest"
            request = Request(
                github_url,
                headers={
                    "Accept": "application/vnd.github+json",
                    "User-Agent": "Klopfer-Bot-Lavalink-Config-Generator",
                },
            )

            with urlopen(request, timeout=15) as response:
                payload = json.load(response)

            resolved_version = str(payload.get("tag_name", "")).strip().lstrip("v")
            if resolved_version:
                version = resolved_version
            else:
                print("No tag_name in GitHub response, using fallback 1.17.0")
        except Exception as error:
            print(f"Failed to fetch latest youtube-plugin version ({error}), using fallback 1.17.0")

        config = f'''server:
          port: 2333
          address: 0.0.0.0

        lavalink:
          plugins:
            - dependency: "dev.lavalink.youtube:youtube-plugin:{version}"
              snapshot: false
          server:
            password: "youshallnotpass"
            sources:
              youtube: false
              bandcamp: true
              soundcloud: true
              twitch: true
              vimeo: true
              http: true
              local: false
            bufferDurationMs: 400
            frameBufferDurationMs: 5000
            youtubePlaylistLoadLimit: 6
            playerUpdateInterval: 5
            youtubeSearchEnabled: false
            soundcloudSearchEnabled: true
            gc-warnings: true

        plugins:
          youtube:
            enabled: true
            allowSearch: true
            allowDirectVideoIds: true
            allowDirectPlaylistIds: true
            clients:
              - MUSIC
              - WEB
              - ANDROID_TESTSUITE
              - TVHTML5EMBEDDED

        metrics:
          prometheus:
            enabled: false
            endpoint: /metrics

        sentry:
          dsn: ""
          environment: ""

        logging:
          file:
            max-history: 30
            max-size: 1GB
            path: ./logs/

          level:
            root: INFO
            lavalink: INFO

          logback:
            rollingpolicy:
              max-file-size: 100MB
              max-history: 30
        '''

        with open("/config/application.yml", "w", encoding="utf-8") as generated:
            generated.write(config)

        print(f"Generated /config/application.yml with youtube-plugin version {version}")
    volumes:
      - lavalink-config:/config

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    restart: unless-stopped
    depends_on:
      lavalink-config:
        condition: service_completed_successfully
    environment:
      - _JAVA_OPTIONS=-Xmx2G
      - SERVER_PORT=2333
      - SERVER_ADDRESS=0.0.0.0
      - LAVALINK_SERVER_PASSWORD=youshallnotpass
      - SPRING_CONFIG_LOCATION=file:/config/application.yml
      - SPRING_CLOUD_CONFIG_ENABLED=false
      - SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED=false
    ports:
      - "2333:2333"
    volumes:
      - lavalink-config:/config:ro
    networks:
      - klopfer-network

  bot:
    build:
      context: .
      no_cache: true
    restart: unless-stopped
    depends_on:
      - lavalink
    environment:
      - TOKEN=${TOKEN}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=youshallnotpass
    volumes:
      - bot-database:/app/database
      - bot-leaderboard:/app/leaderboard
    networks:
      - klopfer-network

volumes:
  lavalink-config:
    driver: local
  bot-database:
    driver: local
  bot-leaderboard:
    driver: local

networks:
  klopfer-network:
    driver: bridge